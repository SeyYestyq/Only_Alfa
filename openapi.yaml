openapi: 3.1.0
info:
  title: Умный кредитный кабинет предпринимателя
  description: 'Only_Alfa · хакатон «Альфа-Будущее». 11 эндпоинтов ТЗ v3.2: 360°-ДНК,
    дискретный RiskScore, Decision Engine, Мультибанк, ПЭП, Xray.'
  version: 1.0.0
paths:
  /api/v1/companies:
    get:
      tags:
      - companies
      summary: List Companies
      description: 5 демо-компаний и их пользователи для Demo Control Bar.
      operationId: list_companies_api_v1_companies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
  /api/v1/companies/lookup-inn:
    post:
      tags:
      - companies
      summary: Lookup Inn
      description: 360°-портрет по любому валидному ИНН (симулятор, seed=hash(INN)).
      operationId: lookup_inn_api_v1_companies_lookup_inn_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupInnRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupInnResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/companies/{company_id}/dashboard:
    get:
      tags:
      - companies
      summary: Company Dashboard
      description: 'Данные Экрана 1: ДНК, прогноз кассы, радар, новости, выписка,
        чипсы.'
      operationId: company_dashboard_api_v1_companies__company_id__dashboard_get
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          title: Company Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/companies/{company_id}/applications:
    get:
      tags:
      - companies
      summary: Company Applications
      description: История заявок компании (дополнительный эндпоинт для навигации
        SPA).
      operationId: company_applications_api_v1_companies__company_id__applications_get
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          title: Company Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/companies/{company_id}/smart-search:
    post:
      tags:
      - smart-search
      summary: Smart Search
      description: Intent Parser (4 класса) → поставщики → плашка или Режим тишины.
      operationId: smart_search_api_v1_companies__company_id__smart_search_post
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          title: Company Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartSearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/invoice-templates:
    get:
      tags:
      - applications
      summary: Invoice Templates
      description: 3 предзаготовленных демо-счёта для мгновенной демонстрации.
      operationId: invoice_templates_api_v1_applications_invoice_templates_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InvoiceTemplateSchema'
                type: array
                title: Response Invoice Templates Api V1 Applications Invoice Templates
                  Get
  /api/v1/applications:
    post:
      tags:
      - applications
      summary: Create Application
      description: 'Создать заявку: Hard Stop → аномалия → скоринг → решение.'
      operationId: create_application_api_v1_applications_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/parse-invoice:
    post:
      tags:
      - applications
      summary: Parse Invoice
      description: PDF-счёт (pdfplumber) или демо-шаблон → проверка ИНН → черновик
        заявки.
      operationId: parse_invoice_api_v1_applications_parse_invoice_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_parse_invoice_api_v1_applications_parse_invoice_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseInvoiceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}:
    get:
      tags:
      - applications
      summary: Get Application
      description: Текущее состояние заявки (дополнительный эндпоинт для SPA).
      operationId: get_application_api_v1_applications__application_id__get
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}/verify-multibank:
    post:
      tags:
      - applications
      summary: Verify Multibank
      description: 'Симулятор Open Banking: +90 баллов, +25% к лимиту, снятие аномалии.'
      operationId: verify_multibank_api_v1_applications__application_id__verify_multibank_post
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultibankVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}/accept-offer:
    post:
      tags:
      - applications
      summary: Accept Offer
      description: Клиент выбирает один из 4 встречных офферов (дополнительный эндпоинт).
      operationId: accept_offer_api_v1_applications__application_id__accept_offer_post
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOfferRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}/underwriter-action:
    post:
      tags:
      - applications
      summary: Underwriter Action
      description: 'Действие инспектора: APPROVE / COUNTER_OFFER / NEED_MORE_INFO
        / REJECT.'
      operationId: underwriter_action_api_v1_applications__application_id__underwriter_action_post
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnderwriterActionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}/ceo-approve:
    post:
      tags:
      - applications
      summary: Ceo Approve
      description: 'Подписание ПЭП: ООО — только CEO_OWNER (иначе 403), невалидный
        статус — 409.'
      operationId: ceo_approve_api_v1_applications__application_id__ceo_approve_post
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CeoApproveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/applications/{application_id}/xray:
    get:
      tags:
      - applications
      summary: Application Xray
      description: 'Экран 3: P&L, Waterfall, OSM, аудит.'
      operationId: application_xray_api_v1_applications__application_id__xray_get
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XrayResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/transactions/{transaction_id}/installment:
    post:
      tags:
      - applications
      summary: Transaction Installment
      description: Пост-транзакционная рассрочка на 3–6 месяцев.
      operationId: transaction_installment_api_v1_transactions__transaction_id__installment_post
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
          title: Transaction Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Health Health Get
components:
  schemas:
    AcceptOfferRequest:
      properties:
        offer_index:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Offer Index
        actor_role:
          type: string
          enum:
          - CEO_OWNER
          - IP_OWNER
          - ACCOUNTANT
          - UNDERWRITER
          title: Actor Role
          default: ACCOUNTANT
      type: object
      required:
      - offer_index
      title: AcceptOfferRequest
    AiEnrichmentSchema:
      properties:
        text:
          type: string
          title: Text
        model:
          type: string
          title: Model
        latency_ms:
          type: number
          title: Latency Ms
      type: object
      required:
      - text
      - model
      - latency_ms
      title: AiEnrichmentSchema
    AnomalySchema:
      properties:
        detected:
          type: boolean
          title: Detected
        declared_monthly_revenue:
          type: number
          title: Declared Monthly Revenue
        alfa_monthly_revenue:
          type: number
          title: Alfa Monthly Revenue
        deviation_pct:
          type: number
          title: Deviation Pct
        message:
          type: string
          title: Message
      type: object
      required:
      - detected
      - declared_monthly_revenue
      - alfa_monthly_revenue
      - deviation_pct
      - message
      title: AnomalySchema
    AntifraudSchema:
      properties:
        is_verified:
          type: boolean
          title: Is Verified
        egrul_status:
          type: string
          title: Egrul Status
        fssp_amount_rub:
          type: number
          title: Fssp Amount Rub
        message:
          type: string
          title: Message
      type: object
      required:
      - is_verified
      - egrul_status
      - fssp_amount_rub
      - message
      title: AntifraudSchema
    ApplicationCreateRequest:
      properties:
        company_id:
          type: string
          title: Company Id
        product_type:
          type: string
          enum:
          - INVEST_LEASING
          - VKL
          - OVERDRAFT
          title: Product Type
        requested_amount_rub:
          type: number
          exclusiveMinimum: 0.0
          title: Requested Amount Rub
        term_months:
          type: integer
          maximum: 120.0
          minimum: 1.0
          title: Term Months
        declared_monthly_revenue:
          type: number
          exclusiveMinimum: 0.0
          title: Declared Monthly Revenue
        actor_role:
          type: string
          enum:
          - CEO_OWNER
          - IP_OWNER
          - ACCOUNTANT
          - UNDERWRITER
          title: Actor Role
          default: ACCOUNTANT
        draft_application_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Draft Application Id
      type: object
      required:
      - company_id
      - product_type
      - requested_amount_rub
      - term_months
      - declared_monthly_revenue
      title: ApplicationCreateRequest
    ApplicationListResponse:
      properties:
        applications:
          items:
            $ref: '#/components/schemas/DraftSummarySchema'
          type: array
          title: Applications
      type: object
      required:
      - applications
      title: ApplicationListResponse
    ApplicationSchema:
      properties:
        application_id:
          type: string
          title: Application Id
        company:
          $ref: '#/components/schemas/CompanyBriefSchema'
        status:
          type: string
          title: Status
        status_label:
          type: string
          title: Status Label
        outcome:
          type: string
          title: Outcome
        outcome_label:
          type: string
          title: Outcome Label
        product_type:
          type: string
          title: Product Type
        product_label:
          type: string
          title: Product Label
        risk_score:
          type: integer
          title: Risk Score
        raw_score:
          type: integer
          title: Raw Score
        is_hard_stop:
          type: boolean
          title: Is Hard Stop
        hard_stop_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Hard Stop Reason
        requested_amount_rub:
          type: number
          title: Requested Amount Rub
        approved_amount_rub:
          type: number
          title: Approved Amount Rub
        term_months:
          type: integer
          title: Term Months
        final_rate_pct:
          type: number
          title: Final Rate Pct
        monthly_payment_rub:
          type: number
          title: Monthly Payment Rub
        declared_monthly_revenue:
          type: number
          title: Declared Monthly Revenue
        monthly_revenue_alfa:
          type: number
          title: Monthly Revenue Alfa
        monthly_revenue_multibank:
          type: number
          title: Monthly Revenue Multibank
        fcf_rub:
          type: number
          title: Fcf Rub
        max_payment_rub:
          type: number
          title: Max Payment Rub
        k_sector:
          type: number
          title: K Sector
        factors_breakdown:
          items:
            $ref: '#/components/schemas/FactorSchema'
          type: array
          title: Factors Breakdown
        counter_offers:
          items:
            $ref: '#/components/schemas/CounterOfferSchema'
          type: array
          title: Counter Offers
        rejection_checklist:
          items:
            type: string
          type: array
          title: Rejection Checklist
        selected_offer_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Selected Offer Index
        anomaly:
          anyOf:
          - $ref: '#/components/schemas/AnomalySchema'
          - type: 'null'
        checks:
          items:
            $ref: '#/components/schemas/CheckSchema'
          type: array
          title: Checks
        multibank:
          $ref: '#/components/schemas/MultibankInfoSchema'
        invoice:
          anyOf:
          - type: object
          - type: 'null'
          title: Invoice
        account_balance:
          type: number
          title: Account Balance
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
      type: object
      required:
      - application_id
      - company
      - status
      - status_label
      - outcome
      - outcome_label
      - product_type
      - product_label
      - risk_score
      - raw_score
      - is_hard_stop
      - requested_amount_rub
      - approved_amount_rub
      - term_months
      - final_rate_pct
      - monthly_payment_rub
      - declared_monthly_revenue
      - monthly_revenue_alfa
      - monthly_revenue_multibank
      - fcf_rub
      - max_payment_rub
      - k_sector
      - factors_breakdown
      - counter_offers
      - rejection_checklist
      - checks
      - multibank
      - account_balance
      title: ApplicationSchema
    BankPnlSchema:
      properties:
        requested_amount_rub:
          type: number
          title: Requested Amount Rub
        approved_amount_rub:
          type: number
          title: Approved Amount Rub
        expected_interest_income_rub:
          type: number
          title: Expected Interest Income Rub
        funding_cost_rub:
          type: number
          title: Funding Cost Rub
        risk_cost_rub:
          type: number
          title: Risk Cost Rub
        opex_rub:
          type: number
          title: Opex Rub
        expected_margin_rub:
          type: number
          title: Expected Margin Rub
        margin_pct:
          type: number
          title: Margin Pct
        ltv_rub:
          type: number
          title: Ltv Rub
        approval_probability_pct:
          type: integer
          title: Approval Probability Pct
        probability_of_default_pct:
          type: number
          title: Probability Of Default Pct
      type: object
      required:
      - requested_amount_rub
      - approved_amount_rub
      - expected_interest_income_rub
      - funding_cost_rub
      - risk_cost_rub
      - opex_rub
      - expected_margin_rub
      - margin_pct
      - ltv_rub
      - approval_probability_pct
      - probability_of_default_pct
      title: BankPnlSchema
    BankValueSchema:
      properties:
        title:
          type: string
          title: Title
        points:
          items:
            type: string
          type: array
          title: Points
        pdf_value:
          items:
            type: string
          type: array
          title: Pdf Value
        cash_forecast_value:
          items:
            type: string
          type: array
          title: Cash Forecast Value
      type: object
      required:
      - title
      - points
      - pdf_value
      - cash_forecast_value
      title: BankValueSchema
    Body_parse_invoice_api_v1_applications_parse_invoice_post:
      properties:
        company_id:
          type: string
          title: Company Id
        template_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Code
        file:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: File
      type: object
      required:
      - company_id
      title: Body_parse_invoice_api_v1_applications_parse_invoice_post
    BusinessDnaSchema:
      properties:
        blocks:
          items:
            $ref: '#/components/schemas/DnaBlockSchema'
          type: array
          title: Blocks
        completeness_pct:
          type: integer
          title: Completeness Pct
      type: object
      required:
      - blocks
      - completeness_pct
      title: BusinessDnaSchema
    CashForecastSchema:
      properties:
        days:
          items:
            $ref: '#/components/schemas/ForecastDaySchema'
          type: array
          title: Days
        min_balance_rub:
          type: number
          title: Min Balance Rub
        min_day:
          type: integer
          title: Min Day
        days_negative:
          type: integer
          title: Days Negative
        has_gap:
          type: boolean
          title: Has Gap
      type: object
      required:
      - days
      - min_balance_rub
      - min_day
      - days_negative
      - has_gap
      title: CashForecastSchema
    CashGapSummarySchema:
      properties:
        min_balance_rub:
          type: number
          title: Min Balance Rub
        min_day:
          type: integer
          title: Min Day
        days_negative:
          type: integer
          title: Days Negative
        has_gap:
          type: boolean
          title: Has Gap
      type: object
      required:
      - min_balance_rub
      - min_day
      - days_negative
      - has_gap
      title: CashGapSummarySchema
    CeoApproveRequest:
      properties:
        actor_role:
          type: string
          enum:
          - CEO_OWNER
          - IP_OWNER
          - ACCOUNTANT
          - UNDERWRITER
          title: Actor Role
      type: object
      required:
      - actor_role
      title: CeoApproveRequest
    CheckSchema:
      properties:
        id:
          type: string
          title: Id
        code:
          type: string
          title: Code
        status:
          type: string
          title: Status
        message:
          type: string
          title: Message
        details:
          type: object
          title: Details
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
      type: object
      required:
      - id
      - code
      - status
      - message
      - details
      title: CheckSchema
    CompanyBriefSchema:
      properties:
        id:
          type: string
          title: Id
        inn:
          type: string
          title: Inn
        name:
          type: string
          title: Name
        legal_form:
          type: string
          title: Legal Form
        okved_code:
          type: string
          title: Okved Code
        okved_cluster:
          type: string
          title: Okved Cluster
        account_balance:
          type: number
          title: Account Balance
        demo_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Demo Key
        users:
          items:
            $ref: '#/components/schemas/CompanyUserSchema'
          type: array
          title: Users
      type: object
      required:
      - id
      - inn
      - name
      - legal_form
      - okved_code
      - okved_cluster
      - account_balance
      - users
      title: CompanyBriefSchema
    CompanyDetailSchema:
      properties:
        id:
          type: string
          title: Id
        inn:
          type: string
          title: Inn
        name:
          type: string
          title: Name
        legal_form:
          type: string
          title: Legal Form
        okved_code:
          type: string
          title: Okved Code
        okved_cluster:
          type: string
          title: Okved Cluster
        account_balance:
          type: number
          title: Account Balance
        demo_key:
