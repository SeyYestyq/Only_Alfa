# SPA + reverse proxy к FastAPI внутри docker-сети.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF-выписки для Invoice-to-Credit: до 10 МБ (ТЗ-04).
    client_max_body_size 10m;

    # Сжатие текстовых ресурсов SPA и JSON-ответов API.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Файлы Vite содержат хэш в имени — кэшируем надолго.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html не кэшируем, иначе после деплоя откроется старая сборка.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /api/v1/... уходит на backend без переписывания пути.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Health-check backend доступен и через frontend-порт.
    location = /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI удобно открывать с того же порта, что и SPA.
    location /docs {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # History API: любой неизвестный путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
